<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RV Plantas - Catálogo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CABEÇALHO -->
  <header>
    <div class="logo">
      <strong>RV - PLANTAS</strong>
      <span>Plantas da Amazônia</span>
    </div>

    <div class="titulo">
      <h1>Meu Catálogo</h1>
      <p>Confira nossos produtos</p>
    </div>

    <!-- ÍCONE DA CESTA -->
    <button class="botao-cesta" onclick="abrirCesta()" aria-label="Abrir cesta">
      🛒
      <span id="contador-cesta">0</span>
    </button>
  </header>

  <!-- PRODUTOS (gerados pelo script.js a partir da lista de produtos) -->
  <main class="produtos" id="produtos"></main>

  <!-- BOTÃO ÚNICO -->
  <div class="area-adicionar">
    <button class="botao-adicionar" onclick="adicionarSelecionados()">
      🛒 Adicionar à cesta
    </button>
  </div>

  <!-- FUNDO ESCURO -->
  <div id="fundo-cesta" class="fundo-cesta" onclick="fecharCesta()"></div>

  <!-- CESTA -->
  <aside id="cesta" class="cesta">
    <div class="cesta-cabecalho">
      <h2>🛒 Minha cesta</h2>
      <button onclick="fecharCesta()" aria-label="Fechar cesta">✕</button>
    </div>

    <div id="itens-cesta" class="itens-cesta">
      <p class="cesta-vazia">Sua cesta está vazia.</p>
    </div>

    <div class="cesta-rodape">
      <label class="campo-nome">
        Seu nome (opcional)
        <input type="text" id="nome-cliente" maxlength="60"
               placeholder="Como podemos te chamar?" oninput="salvarNome()">
      </label>

      <div class="total">
        <span>Total:</span>
        <strong id="total-cesta">R$ 0,00</strong>
      </div>

      <button class="botao-finalizar" onclick="finalizarPedido()">
        Finalizar pedido
      </button>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
